<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Attendance Scanner</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- HTML5 QR Code Library -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    @keyframes scanPulse {
      0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
      70% { box-shadow: 0 0 0 12px rgba(59, 130, 246, 0); }
      100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
    }
    .detect-ring {
      animation: scanPulse 0.8s ease-out;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-6 flex flex-col items-center border border-slate-200">
    <h1 class="text-2xl font-bold text-slate-800 mb-1">QR Attendance System</h1>
    <p class="text-xs font-medium text-slate-500 mb-4 uppercase tracking-wider">Cutoff: 7:30 AM | Cooldown: 30 mins</p>

    <!-- Camera Viewport Container -->
    <div id="reader-wrapper" class="w-full rounded-xl overflow-hidden transition-all duration-300 border-2 border-slate-300">
      <div id="reader" class="w-full bg-black min-h-[300px]"></div>
    </div>

    <!-- Status Alert Display -->
    <div id="status-card" class="w-full mt-5 p-4 rounded-xl text-center hidden transition-all duration-200">
      <h2 id="status-title" class="font-bold text-base"></h2>
      <p id="status-msg" class="text-sm mt-1 whitespace-pre-line"></p>
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzUZUxSxBJedETA102JkNr40wrWeXpGEriuEif-T2LllbDtG3y6uyS8Cayd-jQcOB-5kA/exec";

    const GLOBAL_COOLDOWN_MS = 7000;
    let lastScanTimestamp = 0;
    let isProcessing = false;
    let countdownTimer = null;

    // --- AUDIO SYNTHESIZER ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTone(freq, duration, callback, waveType = "sine") {
      try {
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = waveType;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

        gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + duration);

        if (callback) {
          setTimeout(callback, duration * 1000);
        }
      } catch (e) {
        console.warn("Audio playback not allowed yet:", e);
      }
    }

    function playSound(type) {
      if (type === "detect") {
        // Quick high blip when QR is detected by camera
        playTone(1200, 0.06);
      } else if (type === "success") {
        // High melodic chime for verified Time In / Time Out
        playTone(600, 0.1, () => {
          setTimeout(() => playTone(850, 0.16), 50);
        });
      } else {
        // Low buzzer for Warning or Error
        playTone(220, 0.35, null, "sawtooth");
      }
    }

    function showStatus(title, message, type) {
      const card = document.getElementById("status-card");
      const titleElem = document.getElementById("status-title");
      const msgElem = document.getElementById("status-msg");

      card.className = "w-full mt-5 p-4 rounded-xl text-center border font-sans";
      if (type === "success") {
        card.classList.add("bg-emerald-50", "text-emerald-800", "border-emerald-300");
      } else if (type === "warning") {
        card.classList.add("bg-amber-50", "text-amber-800", "border-amber-300");
      } else {
        card.classList.add("bg-rose-50", "text-rose-800", "border-rose-300");
      }

      titleElem.innerText = title;
      msgElem.innerText = message;
      card.classList.remove("hidden");
    }

    async function handleScanSuccess(decodedText) {
      const now = Date.now();

      // Check if scanner cooldown is active
      const elapsed = now - lastScanTimestamp;
      if (elapsed < GLOBAL_COOLDOWN_MS) {
        return;
      }

      if (isProcessing) return;
      isProcessing = true;
      lastScanTimestamp = now;

      // 1. Instant feedback: Sound + Visual border flash
      playSound("detect");
      const wrapper = document.getElementById("reader-wrapper");
      wrapper.classList.add("detect-ring", "border-blue-500");
      setTimeout(() => {
        wrapper.classList.remove("detect-ring", "border-blue-500");
      }, 800);

      if (countdownTimer) {
        clearInterval(countdownTimer);
      }

      // Show immediate detection state
      showStatus("QR Code Detected!", `Scanned LRN: ${decodedText.trim()}\nValidating with database...`, "warning");

      try {
        const response = await fetch(WEB_APP_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ lrn: decodedText.trim() })
        });

        const result = await response.json();
        let baseMessage = "";

        if (result.status === "success") {
          playSound("success");
          baseMessage = result.message;
          showStatus(
            result.action === "TIME_IN" ? "✅ TIME IN SUCCESS" : "🚪 TIME OUT SUCCESS",
            baseMessage,
            "success"
          );
        } else if (result.status === "warning") {
          playSound("error");
          baseMessage = result.message;
          showStatus("⚠️ Notice", baseMessage, "warning");
        } else {
          playSound("error");
          baseMessage = result.message;
          showStatus("❌ Error", baseMessage, "error");
        }

        // On-screen cooldown countdown
        let remainingSeconds = Math.ceil(GLOBAL_COOLDOWN_MS / 1000);
        const msgElem = document.getElementById("status-msg");

        countdownTimer = setInterval(() => {
          remainingSeconds--;
          if (remainingSeconds > 0) {
            msgElem.innerText = `${baseMessage}\n\nNext scan available in ${remainingSeconds}s...`;
          } else {
            msgElem.innerText = `${baseMessage}\n\nReady for next student.`;
            clearInterval(countdownTimer);
          }
        }, 1000);

      } catch (err) {
        playSound("error");
        showStatus("Connection Error", "Unable to communicate with the database. Please check your internet connection.", "error");
      } finally {
        isProcessing = false;
      }
    }

    const html5QrCode = new Html5Qrcode("reader");

    Html5Qrcode.getCameras().then(devices => {
      if (devices && devices.length) {
        let selectedCamera = devices.find(device => 
          device.label.toLowerCase().includes("back") || 
          device.label.toLowerCase().includes("rear") ||
          device.label.toLowerCase().includes("environment")
        );

        let cameraId = selectedCamera ? selectedCamera.id : devices[devices.length - 1].id;

        html5QrCode.start(
          cameraId,
          {
            fps: 10,
            qrbox: { width: 250, height: 250 }
          },
          handleScanSuccess
        ).catch(err => {
          showStatus("Camera Start Error", "Failed to start camera feed: " + err, "error");
        });
      } else {
        showStatus("No Camera Found", "No camera hardware detected on this device.", "error");
      }
    }).catch(err => {
      showStatus("Permission Error", "Unable to access camera. Please ensure permissions are granted.", "error");
    });
  </script>
</body>
</html>
